name: Rocq / Coq Theorem Prover Verification

on:
  push:
    paths:
      - 'formal/coq/**'
      - '.github/workflows/coq.yml'
  pull_request:
    paths:
      - 'formal/coq/**'

jobs:
  coq-compile:
    name: Rocq / Coq Soundness Proofs (coqc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Coq
        run: |
          sudo apt-get update
          sudo apt-get install -y coq

      - name: Compile and Verify Coq/Rocq Soundness Proofs
        working-directory: formal/coq
        run: |
          rm -f *.vo *.vos *.vok *.glob
          coqc PillRedSpec.v
          coqc PillRedInvariants.v
          coqc PillRedSoundness.v
