name: Kani Formal Verification (Rust Core)

on:
  push:
    paths:
      - 'src/**'
      - 'formal/kani/**'
      - 'Cargo.*'
      - '.github/workflows/kani.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'formal/kani/**'
      - 'Cargo.*'

jobs:
  kani-verify:
    name: Kani Model Checking & Symbolic Proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Kani Model Checker
        uses: model-checking/kani-github-action@v1
        with:
          working-directory: formal/kani

      - name: Run Kani Crate Unit Tests
        working-directory: formal/kani
        run: |
          cargo test --verbose
