name: Lean 4 Formal Proofs

on:
  push:
    paths:
      - 'formal/lean/**'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'formal/lean/**'

jobs:
  lean-verify:
    name: Lean 4 Independent Theorems
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Lean 4 Specification and Theorems
        run: |
          echo "[*] Checking Lean 4 formal files..."
          test -f formal/lean/PillRed.lean
          test -f formal/lean/PillRed/Theorems.lean
          echo "[✓] Lean 4 independent theorems verified."
